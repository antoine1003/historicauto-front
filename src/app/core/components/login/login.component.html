<div class="auth-card">

  <!-- Logo -->
  <div class="auth-logo">
    <div class="auth-logo-mark"><span>A</span></div>
    <span class="auth-logo-text">Acme Classic</span>
  </div>

  <h2 class="auth-heading">Bon<br>retour.</h2>
  <p class="auth-subheading">Connectez-vous pour accéder à votre espace.</p>

  @if (apiError()) {
    <div class="auth-error-banner">{{ apiError() }}</div>
  }

  <!-- Email -->
  <div class="auth-field">
    <label class="auth-label" for="login-email">Adresse email</label>
    <input
      pInputText
      id="login-email"
      type="email"
      placeholder="vous@exemple.com"
      autocomplete="email"
      [ngModel]="email()"
      (ngModelChange)="email.set($event)"
      (blur)="emailTouched.set(true)"
      fluid
      class="auth-input"
      [class.auth-input--error]="emailError()"
    />
    @if (emailError()) {
      <p class="auth-field-error">{{ emailError() }}</p>
    }
  </div>

  <!-- Password -->
  <div class="auth-field">
    <div class="auth-label-row">
      <label class="auth-label" for="login-password">Mot de passe</label>
      <a routerLink="/forgot-password" class="auth-link auth-link--sm">
        Mot de passe oublié ?
      </a>
    </div>
    <p-password
      inputId="login-password"
      placeholder="Votre mot de passe"
      [toggleMask]="true"
      [feedback]="false"
      [ngModel]="password()"
      (ngModelChange)="password.set($event)"
      (blur)="passTouched.set(true)"
      autocomplete="current-password"
      fluid
      [inputStyleClass]="passError() ? 'auth-input auth-input--error' : 'auth-input'"
    />
    @if (passError()) {
      <p class="auth-field-error">{{ passError() }}</p>
    }
  </div>

  <p-button
    label="Se connecter"
    styleClass="auth-btn-primary"
    [loading]="loading()"
    [disabled]="loading()"
    (onClick)="onSubmit()"
  />

  <div class="auth-divider"></div>

  <p class="auth-footer">
    Pas encore de compte ?&nbsp;
    <a routerLink="/register" class="auth-link">S'inscrire</a>
  </p>

</div>
