<header class="ha-header">
  <div class="ha-container">
    <div class="ha-header-inner">
      <a routerLink="/" class="ha-brand" (click)="closeMenu()">
        <span class="auth-logo-mark">
          <img [src]="logoUrl()" alt="Logo Historic Auto">
        </span>
        <span class="auth-logo-text">Historic Auto</span>
      </a>

      <nav class="ha-nav" aria-label="Navigation principale">
        <a
          routerLink="/"
          class="ha-nav-link"
          routerLinkActive="ha-nav-link--active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Accueil
        </a>
        <a routerLink="/contact" class="ha-nav-link" routerLinkActive="ha-nav-link--active">
          Contact
        </a>
      </nav>

      <div class="ha-header-actions">
        <ng-container *ngTemplateOutlet="ctaLinks"></ng-container>
      </div>

      <button
        type="button"
        class="ha-burger"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="ha-mobile-menu"
        [attr.aria-label]="menuOpen() ? 'Fermer le menu' : 'Ouvrir le menu'"
      >
        <i class="pi" [class.pi-bars]="!menuOpen()" [class.pi-times]="menuOpen()" aria-hidden="true"></i>
      </button>
    </div>

    <nav
      id="ha-mobile-menu"
      class="ha-mobile-menu"
      aria-label="Menu mobile"
      [style.display]="menuOpen() ? null : 'none'"
    >
      <a routerLink="/" class="ha-nav-link" (click)="closeMenu()">Accueil</a>
      <a routerLink="/contact" class="ha-nav-link" (click)="closeMenu()">Contact</a>

      <ng-container *ngTemplateOutlet="ctaLinks"></ng-container>
    </nav>
  </div>
</header>

<ng-template #ctaLinks>
  @if (auth.isInitialized()) {
    @if (auth.isAuthenticated()) {
      @if (auth.currentUser()?.email; as email) {
        <span class="ha-user" [title]="email">
          <i class="pi pi-user" aria-hidden="true"></i>
          <span class="ha-user-label">Connecté en tant que</span>
          <span class="ha-user-email">{{ email }}</span>
        </span>
      }
      <a routerLink="/dashboard" class="ha-btn ha-btn--primary" (click)="closeMenu()">Mon Espace</a>
      <button type="button" class="ha-nav-link" (click)="logout()">Déconnexion</button>
    } @else {
      <a routerLink="/login" class="ha-nav-link" (click)="closeMenu()">Connexion</a>
      <a routerLink="/register" class="ha-btn ha-btn--primary" (click)="closeMenu()">
        Créer un compte
      </a>
    }
  }
</ng-template>
